backend:
  name: git-gateway
  branch: main

# Folder penyimpanan otomatis saat pengurus mengunggah foto lewat halaman admin
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Berita & Kegiatan"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul Kegiatan", name: "title", widget: "string" }
      - { label: "Ringkasan Singkat", name: "description", widget: "text" }
      - { label: "Tanggal Kegiatan", name: "pubDate", widget: "datetime" }
      - { label: "Foto Utama", name: "heroImage", widget: "image", required: false }
      - { label: "Isi Berita", name: "body", widget: "markdown" }
